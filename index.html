<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>醫用英語 - 弱項加強版</title>
    <style>
        :root { --primary: #3498db; --bg: #2c3e50; --accent: #2ecc71; --warning: #f1c40f; }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: white; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; touch-action: manipulation; }
        .container { width: 100%; max-width: 500px; }
        
        .settings-panel { background: rgba(0,0,0,0.4); padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); width: 100%; text-align: center; }
        input[type="range"] { width: 100%; margin: 15px 0 5px 0; -webkit-appearance: none; background: transparent; }
        input[type="range"]::-webkit-slider-runnable-track { width: 100%; height: 8px; background: #7f8c8d; border-radius: 5px; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; height: 26px; width: 26px; border-radius: 50%; background: var(--accent); margin-top: -9px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        label { font-size: 0.95em; color: #bdc3c7; font-weight: bold; display: block; }
        
        .menu-item { background: white; color: #2c3e50; padding: 18px; margin-bottom: 12px; border-radius: 12px; cursor: pointer; border-left: 6px solid var(--primary); font-size: 1.1em; }
        .menu-item.weak-list { border-left-color: var(--warning); background: #fff9e6; }
        
        #app-screen { display: none; width: 100%; }
        #mode-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; width: 100%; }
        
        .card { background: white; color: #2c3e50; height: 260px; border-radius: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 25px 15px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; position: relative; }
        .word-en { font-size: 1.55em; font-weight: bold; margin-bottom: 10px; min-height: 2.2em; display: flex; align-items: center; justify-content: center; word-break: break-word; line-height: 1.2; width: 100%; flex-wrap: wrap; gap: 0.2em; }
        .hidden { visibility: hidden; } /* 改用 visibility 避免排版跳動 */
        
        /* 收藏星星樣式 */
        .btn-star { position: absolute; top: 15px; right: 15px; font-size: 1.8em; cursor: pointer; color: #ccc; transition: 0.2s; }
        .btn-star.active { color: var(--warning); transform: scale(1.2); }

        .btn-speak { background: var(--accent); font-size: 2.2em; width: 80px; height: 80px; border-radius: 50%; border: 4px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.2); margin: 15px 0; padding: 0; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .nav-btn { background: #7f8c8d; padding: 15px; border-radius: 10px; color: white; border: none; font-weight: bold; width: 100%; text-align: center; font-size: 1em; cursor: pointer; }
        .btn-back { background: #e74c3c; width: 100%; margin-bottom: 15px; padding: 12px; border-radius: 10px; color: white; border: none; font-size: 1.1em; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body onpointerdown="initAudioContext()">

<div class="container" id="menu-screen">
    <h1 style="text-align: center; margin-bottom: 15px;">🚑 醫用單字排程</h1>
    
    <div class="settings-panel">
        <label>⚡ 語速調整: <span id="rate-val">0.9</span>x</label>
        <input type="range" id="rate-range" min="0.3" max="1.5" step="0.1" value="0.9" oninput="document.getElementById('rate-val').innerText=this.value">
    </div>

    <!-- 弱項清單入口 -->
    <div id="weak-menu-item"></div>
    <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 15px 0;">
    <div id="menu-items"></div>
</div>

<div class="container" id="app-screen">
    <button class="btn-back" onclick="location.reload()">← 返回選單</button>
    <div id="mode-selector"></div>
    
    <div class="card">
        <!-- 收藏星星 -->
        <div id="star-icon" class="btn-star" onclick="toggleWeak()">★</div>
        <div class="word-en" id="q-en" onclick="reveal()">EN</div>
        <div class="word-zh" style="font-size:1.3em; color:#34495e; font-weight:bold;" id="q-zh" onclick="reveal()">ZH</div>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; width:100%; gap:15px; margin-top:10px;">
        <button class="nav-btn" onclick="prev()">◀</button>
        <button class="btn-speak" onclick="speak()">🔊</button>
        <button class="nav-btn" onclick="next()">▶</button>
    </div>
    <button class="nav-btn" style="background:#9b59b6; width:100%; margin-top:15px;" onclick="reveal()">👁️ 查看答案</button>
    <p id="progress" style="text-align:center; margin-top:20px; color:#bdc3c7; font-weight:bold;"></p>
</div>

<script>
    // 單字資料庫 (與原本相同，此處簡略表示)
    const allWords = [
        {en:"Abdominal pain",zh:"腹部疼痛"}, {en:"Abdominal swelling",zh:"腹部腫脹"},
        {en:"Acquired Immunodeficiency syndrome",zh:"後天免疫缺乏症候群(AIDS)"},
        {en:"Acute Glomerulonephritis",zh:"急性腎絲球腎炎(AGN)"},
        // ... (請保留你原本那 200 多個單字)
        {en:"Wrist sprain",zh:"腕部扭傷"}, {en:"Zygomatic Fracture",zh:"顴骨骨折"}
    ];

    // 初始化儲存空間
    let weakWords = JSON.parse(localStorage.getItem('medical_weak_list')) || [];
    let targetVoice = null;
    let batch = [], idx = 0, currentMode = '';

    function initAudioContext() {
        if (!targetVoice) loadVoices();
    }

    function loadVoices() {
        const voices = window.speechSynthesis.getVoices();
        targetVoice = voices.find(v => v.name.includes('Alex') || v.name.includes('Tom'));
    }

    function toggleWeak() {
        const currentWord = batch[idx].en;
        const star = document.getElementById('star-icon');
        
        if (weakWords.includes(currentWord)) {
            weakWords = weakWords.filter(w => w !== currentWord);
            star.classList.remove('active');
        } else {
            weakWords.push(currentWord);
            star.classList.add('active');
        }
        localStorage.setItem('medical_weak_list', JSON.stringify(weakWords));
        updateWeakMenu();
    }

    function updateWeakMenu() {
        const container = document.getElementById('weak-menu-item');
        container.innerHTML = '';
        if (weakWords.length > 0) {
            let div = document.createElement('div');
            div.className = 'menu-item weak-list';
            div.innerHTML = `<b>🔥 我的弱項加強</b><br><small>目前共有 ${weakWords.length} 個單字</small>`;
            div.onclick = () => { 
                currentMode = 'weak';
                batch = allWords.filter(w => weakWords.includes(w.en));
                startApp();
            };
            container.appendChild(div);
        }
    }

    function startApp() {
        document.getElementById('menu-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'block';
        document.getElementById('mode-selector').innerHTML = `
            <button class="nav-btn" onclick="setMode('learn')">練習</button>
            <button class="nav-btn" onclick="setMode('recite')">背誦</button>
            <button class="nav-btn" onclick="setMode('random')">亂數</button>
            <button class="nav-btn" style="background:#e67e22;" onclick="setMode('exam')">挑戰</button>
        `;
        idx = 0;
        updateUI();
    }

    function setMode(m) {
        currentMode = m;
        if (m === 'random' || m === 'exam') batch.sort(() => Math.random() - 0.5);
        idx = 0;
        updateUI();
    }

    function updateUI() {
        window.speechSynthesis.cancel();
        const wordObj = batch[idx];
        const qEn = document.getElementById('q-en');
        const star = document.getElementById('star-icon');
        
        // 更新星星狀態
        star.className = weakWords.includes(wordObj.en) ? 'btn-star active' : 'btn-star';
        
        // 處理單字點擊發音
        qEn.innerHTML = '';
        wordObj.en.split(' ').forEach((w, i, arr) => {
            const span = document.createElement('span');
            span.innerText = w;
            span.onclick = (e) => { e.stopPropagation(); speakWord(w); };
            qEn.appendChild(span);
            if (i < arr.length - 1) qEn.appendChild(document.createTextNode(' '));
        });

        document.getElementById('q-zh').innerText = wordObj.zh;
        
        // 模式顯示邏輯
        const isHidden = (currentMode !== 'learn');
        qEn.classList.toggle('hidden', isHidden);
        document.getElementById('q-zh').classList.toggle('hidden', isHidden);
        
        document.getElementById('progress').innerText = `${idx+1} / ${batch.length}`;
    }

    function reveal() {
        document.getElementById('q-en').classList.remove('hidden');
        document.getElementById('q-zh').classList.remove('hidden');
    }

    function next() { idx = (idx+1)%batch.length; updateUI(); }
    function prev() { idx = (idx-1+batch.length)%batch.length; updateUI(); }

    function speak() {
        const msg = new SpeechSynthesisUtterance(batch[idx].en);
        msg.rate = document.getElementById('rate-range').value;
        window.speechSynthesis.speak(msg);
    }

    function speakWord(t) {
        const msg = new SpeechSynthesisUtterance(t);
        msg.rate = document.getElementById('rate-range').value;
        window.speechSynthesis.speak(msg);
    }

    function initMenu() {
        const container = document.getElementById('menu-items');
        updateWeakMenu();
        // 原本的日期選單邏輯...
        const d = new Date(2026, 2, 17);
        for(let i=0; i<Math.ceil(allWords.length/15); i++) {
            let dateStr = `${d.getMonth()+1}/${d.getDate()}`;
            let div = document.createElement('div');
            div.className = 'menu-item';
            div.innerHTML = `<b>${dateStr} 階段範圍</b><br><small>${i*15+1}-${Math.min((i+1)*15, allWords.length)}</small>`;
            div.onclick = () => {
                batch = allWords.slice(i*15, (i+1)*15);
                startApp();
            };
            container.appendChild(div);
            d.setDate(d.getDate() + (i % 2 === 0 ? 3 : 4));
        }
    }

    initMenu();
    if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;
</script>
</body>
</html>
